name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: SuperResApp
  UNIT_TEST_TARGET: SuperResAppTests
  UI_TEST_TARGET: SuperResAppUITests

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test (iOS ${{ matrix.ios }})
    runs-on: macos-14
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: "17.5"
            device: "iPhone 15"
          - ios: "18.2"
            device: "iPhone 16"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install xcodegen
          brew install xcbeautify

      - name: Setup OpenCV XCFramework
        run: bash ./Scripts/setup-opencv.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Verify licenses
        run: bash ./Scripts/verify-licenses.sh

      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SuperResApp.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Unit Tests (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SuperResApp.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
            -only-testing:"$UNIT_TEST_TARGET" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults-${{ matrix.ios }}.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios-${{ matrix.ios }}
          path: TestResults-${{ matrix.ios }}.xcresult
          retention-days: 7

  ui-test:
    name: UI Tests (simulator, no signing)
    runs-on: macos-14
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install xcodegen
          brew install xcbeautify

      - name: Setup OpenCV XCFramework
        run: bash ./Scripts/setup-opencv.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SuperResApp.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            -only-testing:"$UI_TEST_TARGET" \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  release-safety:
    name: Release Safety Checks & Package
    runs-on: macos-14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install xcodegen
          brew install xcbeautify

      - name: Setup OpenCV XCFramework
        run: bash ./Scripts/setup-opencv.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify no DEBUG leakage in Release source
        run: bash ./Scripts/verify-release-no-debug.sh --source-only

      # 将 build 升级为 archive，并进入临时目录，为后续验证打包脚本做准备
      - name: Archive Release (unsigned, generic iOS)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project SuperResApp.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/SuperResApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

      - name: Verify no DEBUG leakage in Archive
        run: bash ./Scripts/verify-release-no-debug.sh --archive "build/SuperResApp.xcarchive"

      # 新增：试运行打包脚本，提前验证 make-unsigned-ipa.sh 的健壮性
      - name: Test Package Unsigned IPA script
        run: |
          bash ./Scripts/make-unsigned-ipa.sh \
            "build/SuperResApp.xcarchive" \
            "build/SuperResApp-test.ipa"
          ls -la build/
      - name: Report Release size and linked inpaint symbols
        run: |
          APP_PATH="build/SuperResApp.xcarchive/Products/Applications/SuperResApp.app"
          EXECUTABLE="$APP_PATH/SuperResApp"
          APP_BYTES="$(du -sk "$APP_PATH" | awk '{print $1 * 1024}')"
          EXECUTABLE_BYTES="$(stat -f%z "$EXECUTABLE")"
          IPA_BYTES="$(stat -f%z "build/SuperResApp-test.ipa")"
          echo "Release app bundle bytes: $APP_BYTES"
          echo "Release executable bytes: $EXECUTABLE_BYTES"
          echo "Unsigned IPA bytes: $IPA_BYTES"
          du -sh "$APP_PATH" "build/SuperResApp-test.ipa"
          if nm -g "$EXECUTABLE" | grep -i 'inpaint' | head -20; then
            echo "Inpaint symbols are present in the Release executable."
          else
            echo "::warning::No readable inpaint symbol found by nm; inspect link map before concluding dead stripping."
          fi

      - name: Upload unsigned Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-ipa
          path: build/SuperResApp-test.ipa
          retention-days: 7
