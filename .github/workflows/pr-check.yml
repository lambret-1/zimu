name: PR Check

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  file-structure:
    name: Required Files & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          set -e
          required=(
            "Features/SubtitleEraser/SubtitleEraserView.swift"
            "Features/SubtitleEraser/SubtitleEraserViewModel.swift"
            "Features/SubtitleEraser/SubtitleEraserStateMachine.swift"
            "Features/SubtitleEraser/GestureCoordinator.swift"
            "Services/Inpaint/InpaintEngine.swift"
            "Services/Inpaint/VideoInpaintPipeline.swift"
            "Services/Inpaint/TemporaryFileManager.swift"
            "Utils/Logger.swift"
            "Bridge/OpenCVBridge.mm"
            "Bridge/SuperResApp-Bridging-Header.h"
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present."

  debug-isolation:
    name: DEBUG Isolation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Debug/ files are DEBUG-only
        run: |
          set -e
          for f in Debug/*.swift; do
            if ! grep -q "#if DEBUG" "$f"; then
              echo "::error file=$f::Debug file must be wrapped with #if DEBUG"
              exit 1
            fi
          done
          echo "DEBUG isolation OK."

  sensitive-log:
    name: Sensitive Log Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for forbidden log patterns
        run: |
          set -e
          pattern='(print\(|NSLog\()'
          hits=$(grep -rnE "$pattern" --include='*.swift' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Use Logger instead of print/NSLog"
            exit 1
          fi
          echo "No raw print/NSLog."

  pr-size:
    name: PR Size Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed lines
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          lines=$(git diff --shortstat "$base" "$head" | awk '{print $4+$6}')
          echo "Changed lines: $lines"
          if [ "${lines:-0}" -gt 2000 ]; then
            echo "::warning::PR exceeds 2000 changed lines; consider splitting."
          fi
