disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_parameter_alignment_on_call

excluded:
  - Pods
  - Frameworks
  - build
  - DerivedData
  - Scripts

line_length:
  warning: 120
  error: 160

file_length:
  warning: 600
  error: 900

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
  excluded:
    - id
    - x
    - y

force_unwrapping: error
implicitly_unwrapped_optional: error
